name: Clout Café — Outreach diario

on:
  schedule:
    # 09:00 ART = 12:00 UTC, lunes a viernes
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

jobs:
  outreach:
    runs-on: ubuntu-latest
    # Presupuesto de tiempo MEDIDO (12/08/2026), no estimado:
    #   por email: 3 ops de base (1.43s c/u) + NOOP 0.19 + sendmail 0.8 + pausa 45
    #              = 50.3s  →  50 emails = 41.9 min
    #   check_replies: 1.9s de login + 0.341s por mensaje del último mes
    #                  = 0.8 min hoy (128 msgs), 5.7 min con 1000 msgs
    #   PEOR CASO paso de emails: 47.7 min  →  timeout 60 (margen 12)
    #   job: 60 + 12 (scraper) + 3 (setup) = 75  →  timeout 90 (margen 15)
    # Si cambia MAX_PER_DAY o DELAY_SECS en send_emails.py, recalcular acá.
    timeout-minutes: 90
    concurrency:                 # nunca dos runs a la vez
      group: outreach-envio
      cancel-in-progress: false

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear archivo .env desde secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" >> .env
          printf 'SUPABASE_SERVICE_KEY=%s\n' "$SUPABASE_SERVICE_KEY" >> .env
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> .env
          printf 'SUPABASE_DB_HOST=%s\n' "$SUPABASE_DB_HOST" >> .env
          printf 'SUPABASE_DB_PORT=%s\n' "$SUPABASE_DB_PORT" >> .env
          printf 'SUPABASE_DB_USER=%s\n' "$SUPABASE_DB_USER" >> .env
          printf 'SUPABASE_DB_PASS=%s\n' "$SUPABASE_DB_PASS" >> .env
          printf 'APOLLO_API_KEY=%s\n' "$APOLLO_API_KEY" >> .env
          printf 'HUNTER_API_KEY=%s\n' "$HUNTER_API_KEY" >> .env
          printf 'GMAIL_USER=%s\n' "$GMAIL_USER" >> .env
          printf 'GMAIL_APP_PASSWORD=%s\n' "$GMAIL_APP_PASSWORD" >> .env
          printf 'GOOGLE_MAPS_API_KEY=%s\n' "$GOOGLE_MAPS_API_KEY" >> .env

      - name: Crear carpeta de logs
        run: mkdir -p logs

      # Peor caso medido: 47.7 min (ver cuenta en timeout-minutes del job)
      - name: Enviar emails
        timeout-minutes: 60
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -u run.py --emails-only --force-hours

      # Scraper de leads. Medido 21/08: con 12 min se CORTABA sin terminar, por
      # eso traía 25 leads/día en vez de los ~45 esperados.
      # Presupuesto: job 90 - emails 41.4 - setup 0.3 - margen 23 = 25 min.
      - name: Buscar nuevos leads
        timeout-minutes: 25
        continue-on-error: true
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python -u run.py --scrape-only
