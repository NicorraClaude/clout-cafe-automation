name: Clout Café — Outreach diario

on:
  schedule:
    # 09:00 ART = 12:00 UTC, lunes a viernes
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear archivo .env desde secrets
        run: |
          cat > .env << 'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DB_HOST=${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT=${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER=${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASS=${{ secrets.SUPABASE_DB_PASS }}
          APOLLO_API_KEY=${{ secrets.APOLLO_API_KEY }}
          HUNTER_API_KEY=${{ secrets.HUNTER_API_KEY }}
          GMAIL_USER=${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          EOF

      - name: Crear carpeta de logs
        run: mkdir -p logs

      # Envío de emails — máximo 10 min, prioridad máxima
      - name: Enviar emails
        timeout-minutes: 10
        run: python run.py --emails-only

      # Scraper de leads — hasta 12 min, no bloquea emails
      - name: Buscar nuevos leads
        timeout-minutes: 12
        continue-on-error: true
        run: python run.py --scrape-only
